apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudcampus-backend-db
  namespace: cloudcampus
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: cloudcampus-backend-db
    creationPolicy: Owner

  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: rds!db-142b468d-82d0-41a3-a315-fcb41cd237a0
        property: username

    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: rds!db-142b468d-82d0-41a3-a315-fcb41cd237a0
        property: password
