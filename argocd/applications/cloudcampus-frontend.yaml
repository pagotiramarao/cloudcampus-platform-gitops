apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcampus-frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  source:
    repoURL: https://github.com/pagotiramarao/cloudcampus-platform-gitops.git
    targetRevision: main
    path: helm/frontend

    helm:
      releaseName: cloudcampus-frontend

  destination:
    server: https://kubernetes.default.svc
    namespace: cloudcampus

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
