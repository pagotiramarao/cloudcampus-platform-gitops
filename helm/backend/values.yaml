replicaCount: 2

image:
  repository: 938379788459.dkr.ecr.us-west-2.amazonaws.com/dev-backend
  tag: "7-663759f"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

probes:
  readiness:
    path: /actuator/health
    initialDelaySeconds: 15
    periodSeconds: 10

  liveness:
    path: /actuator/health
    initialDelaySeconds: 30
    periodSeconds: 20
