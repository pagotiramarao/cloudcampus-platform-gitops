apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudcampus-frontend.fullname" . }}
  labels:
    {{- include "cloudcampus-frontend.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "cloudcampus-frontend.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "cloudcampus-frontend.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
